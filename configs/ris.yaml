# Arizona RIS deployment from the source camera experiment and geographic build.
# Paths resolve relative to this YAML. Provenance: docs/configuration.md.
schema_version: 1
site_id: ris
output_dir: ../outputs/ris
seed: 1477
stage1:
  map_name: SigmaRIS
  mode: build
  osm_file: ../assets/local/ris/site.osm
  overture_geojson: ../assets/local/ris/buildings.geojson
  overture_land_cover_geojson: ../assets/local/ris/land_cover.geojson
  height_mode: overture-ghs
  vegetation_mode: overture-conservative
  ghs_country: USA
  ghs_admin1: Arizona
  carla_root: ../assets/local/CARLA_0.9.16_source
  unreal_editor: ../assets/local/UnrealEngine_4.26/Engine/Binaries/Linux/UE4Editor
  carla_python: ../.venv/bin/python
  xodr_projection_margin_m: 25.0
  flat_terrain: true
  timeout_seconds: 14400
  map_audit_routes:
    southbound:
      start_latitude: 33.418616405888145
      start_longitude: -111.92623489482054
      end_latitude: 33.416952154879134
      end_longitude: -111.92624334349155
    northbound:
      start_latitude: 33.41700857068986
      start_longitude: -111.92638697089876
      end_latitude: 33.418799753624995
      end_longitude: -111.92639541956976
stage2:
  host: 127.0.0.1
  port: 2000
  timeout: 20
  traffic_manager_port: 8100
  map:
    name: SigmaRIS
    assets_version: 0.9.16
  fixed_delta_seconds: 0.1
  max_frames: 150
  sample_every_n_frames: 1
  world_state_every_n_frames: 1
  trajectory_id: 1
  georeference_y_south: true
  route:
    selection: explicit
    start:
      geolocation:
        latitude: 33.418616405888145
        longitude: -111.92623489482054
        altitude: 0.5
    destination:
      geolocation:
        latitude: 33.416952154879134
        longitude: -111.92624334349155
        altitude: 0.5
    via: []
    speed_kmh: 30
    step_m: 2
  vehicles:
    blueprint: vehicle.tesla.model3
    background_count: 24
  rsus:
  - geolocation:
      latitude: 33.41920874636455
      longitude: -111.92717732926977
      altitude: 2.0
    rotation:
      pitch: 0
      yaw: 0.0
      roll: 0
    z_mode: relative_to_ground
  sensors:
    cav:
      enabled: false
    rsu:
      enabled: false
    ris:
      enabled: true
      items:
      - name: rgb_front
        type: rgb
        blueprint: sensor.camera.rgb
        every_n_samples: 1
        image_size_x: 960
        image_size_y: 540
        fov: 90
        transform:
          location:
          - 0
          - 0
          - 0
          rotation:
            pitch: -10
            yaw: 0
            roll: 0
  fov:
    enabled: true
    node_kind: ris
    stop_after_exit_frames: 1
stage3:
  communication_python: ../.venv-communication/bin/python
  radar_python: ../.venv-radar/bin/python
  blender:
    enabled: true
    executable: blender
    static_scene: ../assets/local/ris/SigmaRIS.fbx
    actor_assets: ../assets/local/actors
    crop: true
    crop_margin_m: 100
  radio:
    enabled: true
    frequency_hz: 60000000000
    bandwidth_hz: 100000000
    num_subcarriers: 1
    arrays:
    - - 1
      - 1
      - 16
      - 1
    reconstruction: farfield
    array_spacing_wavelength: 0.5
    antenna_pattern: iso
    polarization: V
    max_depth: 4
    samples_per_src: 100000
    max_num_paths_per_src: 100000
    array_front_filter: false
    rx_antenna_height_m: 0.3
    material_extrapolate: true
    skip_existing: true
    radio_map:
      enabled: false
  radar:
    enabled: false
ris:
  enabled: true
  frequency_hz: 60000000000.0
  nodes:
  - id: ris_001
    latitude: 33.417827
    longitude: -111.926134
    altitude: 2.0
    z_mode: relative_to_ground
    rotation:
      yaw: 180.0
    panel:
      num_rows: 32
      num_cols: 32
      element_spacing_lambda: 0.5
      thickness_m: 0.02
  channel:
    mode: effective
    save_path_parameters: true
    save_full_component_channels: true
    reflection_amplitude: 0.8
    phase_mode: zero
    require_far_field: true
