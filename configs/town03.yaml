        fov: 90
        transform:
          location:
          - 0.0
          - 0.0
          - 1.5
          rotation:
            pitch: 0
            yaw: -90
            roll: 0
        every_n_samples: 1
      - name: rgb_back
        file_prefix: rgb_back
        enabled: true
        type: rgb
        blueprint: sensor.camera.rgb
        image_size_x: 1280
        image_size_y: 720
        fov: 90
        transform:
          location:
          - 0.0
          - 0.0
          - 1.5
          rotation:
            pitch: 0
            yaw: 180
            roll: 0
        every_n_samples: 1
      - name: rgb_right
        file_prefix: rgb_right
        enabled: true
        type: rgb
        blueprint: sensor.camera.rgb
        image_size_x: 1280
        image_size_y: 720
        fov: 90
        transform:
          location:
          - 0.0
          - 0.0
          - 1.5
          rotation:
            pitch: 0
            yaw: 90
            roll: 0
        every_n_samples: 1
      - name: depth_front
        file_prefix: depth_front
        enabled: true
        type: depth
        blueprint: sensor.camera.depth
        image_size_x: 1280
        image_size_y: 720
        fov: 90
        transform:
          location:
          - 0.0
          - 0.0
          - 1.5
          rotation:
            pitch: 0
            yaw: 0
            roll: 0
        depth_max_m: 200.0
        every_n_samples: 1
      - name: depth_left
        file_prefix: depth_left
        enabled: true
        type: depth
        blueprint: sensor.camera.depth
        image_size_x: 1280
        image_size_y: 720
        fov: 90
        transform:
