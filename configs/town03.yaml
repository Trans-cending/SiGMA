stage3:
  communication_python: ../.venv-communication/bin/python
  radar_python: ../.venv-radar/bin/python
  blender:
    enabled: true
    executable: blender
    static_scene: ../assets/local/town03/Town03.fbx
    actor_assets: ../assets/local/actors
    crop: true
    crop_margin_m: 100
  radio:
    enabled: true
    frequency_hz: 28000000000
    bandwidth_hz: 1000000000
    num_subcarriers: 256
    arrays:
    - - 4
      - 4
      - 8
      - 8
    reconstruction: farfield
    array_spacing_wavelength: 0.5
    antenna_pattern: iso
    polarization: V
    max_depth: 4
    samples_per_src: 100000
    max_num_paths_per_src: 100000
    array_front_filter: false
    rx_antenna_height_m: 1.5
    material_extrapolate: true
    skip_existing: true
    radio_map:
      enabled: false
  radar:
    enabled: true
ris:
  enabled: false
