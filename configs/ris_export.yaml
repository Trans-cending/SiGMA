# python -m sigma.map_export.cli -c configs/ris_export.yaml -o assets/local/ris
site_id: ris
map_export:
  enabled: true
  map_name: SigmaRIS
  map_source: custom
  carla_root: ../assets/local/CARLA_0.9.16_source
